[theme]
# Tema oscuro elegante - Dark mode profesional
primaryColor = "#00D4FF"            # Cyan brillante (accents, hover states)
backgroundColor = "#0F1419"        # Negro muy oscuro (body background)
secondaryBackgroundColor = "#1A2332" # Gris oscuro (cards, sidebar)
textColor = "#E2E8F0"              # Gris muy claro (texto principal)
font = "sans serif"

[client]
showErrorDetails = false
toolbarMode = "minimal"

[logger]
level = "error"
